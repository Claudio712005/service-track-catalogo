global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: local

scrape_configs:

  - job_name: catalogo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalogo:8080"]
        labels:
          servico: service-track-catalogo

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
