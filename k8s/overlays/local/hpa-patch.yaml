apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-track-catalogo
spec:
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
