apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track-catalogo

resources:
  - ../../base

images:
  - name: servicetrack-catalogo
    newTag: local

patches:
  - path: patch.yaml
  - path: hpa-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-track-catalogo-config
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - OTEL_JAVAAGENT_ENABLED=false
