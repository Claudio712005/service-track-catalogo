apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track-catalogo

resources:
  - ../../base

components:
  - ../../componentes/mongo-efemero

images:
  - name: servicetrack-catalogo
    newName: 821146464895.dkr.ecr.us-east-1.amazonaws.com/servicetrack-prd-catalogo
    newTag: bootstrap

patches:
  - path: hpa-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-track-catalogo-config
    literals:
      - ST_INS_MONGO_URI=mongodb://service-track-catalogo-mongo:27017/ST_INS
      - ST_CAT_DB_POOL_MAX=10
      - ST_CAT_DB_POOL_MIN=2
      - SERVICETRACK_MENSAGERIA_HABILITADA=false
      - OTEL_JAVAAGENT_ENABLED=false
