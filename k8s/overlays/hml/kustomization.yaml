apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track-catalogo

resources:
  - ../../base

images:
  - name: servicetrack-catalogo
    newName: 734564927706.dkr.ecr.us-east-1.amazonaws.com/servicetrack-hml-catalogo
    newTag: 16e6870719b876c4c6a262729c07718ec83ed1e0

patches:
  - path: hpa-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-track-catalogo-config
    literals:
      - ST_CAT_DB_POOL_MAX=10
      - ST_CAT_DB_POOL_MIN=2
      - SERVICETRACK_MENSAGERIA_HABILITADA=true
      - KAFKA_BOOTSTRAP_SERVERS=service-track-ordens-kafka.service-track-ordens.svc.cluster.local:9092
      - OTEL_JAVAAGENT_ENABLED=false
