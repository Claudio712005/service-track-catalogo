name: service-track-catalogo

services:

  postgres:
    image: postgres:16
    container_name: st-cat-postgres
    environment:
      POSTGRES_DB: st_cat
      POSTGRES_USER: st_cat_user
      POSTGRES_PASSWORD: st_cat_local
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U st_cat_user -d st_cat"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: st-ins-mongo
    environment:
      MONGO_INITDB_DATABASE: ST_INS
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: st-cat-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:9092,EXTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    volumes:
      - kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  topicos:
    image: apache/kafka:3.9.0
    container_name: st-cat-topicos
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topico in servicetrack.estoque.comandos.v1 servicetrack.estoque.comandos.v1.dlt servicetrack.estoque.eventos.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topico" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  catalogo:
    build:
      context: ./software
    image: servicetrack-catalogo:local
    container_name: st-cat-app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      topicos:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ST_CAT_DB_URL: jdbc:postgresql://postgres:5432/st_cat
      ST_CAT_DB_USER: st_cat_user
      ST_CAT_DB_PASSWORD: st_cat_local
      ST_CAT_DB_POOL_MAX: 10
      ST_CAT_DB_POOL_MIN: 2
      ST_INS_MONGO_URI: mongodb://mongo:27017/ST_INS
      SERVICETRACK_MENSAGERIA_HABILITADA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_JAVAAGENT_ENABLED: "true"
      OTEL_SERVICE_NAME: service-track-catalogo
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=servicetrack,deployment.environment=local
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES: "true"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: st-cat-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  tempo:
    image: grafana/tempo:2.6.1
    container_name: st-cat-tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observabilidade/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.3.2
    container_name: st-cat-loki
    user: "0:0"
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observabilidade/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:11.5.2
    container_name: st-cat-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlStreaming
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/catalogo-visao-geral.json
    ports:
      - "3000:3000"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  alertas:
    image: mendhak/http-https-echo:35
    container_name: st-cat-alertas
    environment:
      HTTP_PORT: 8080
      DISABLE_REQUEST_LOGS: "false"
    ports:
      - "8088:8080"

volumes:
  postgres:
  mongo:
  kafka:
  prometheus:
  tempo:
  loki:
  grafana:
